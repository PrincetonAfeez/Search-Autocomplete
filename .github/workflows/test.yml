name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc5484339243502e3a91fe # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8e666f859bf778eb368fbd663acb85e6bd36d9c6 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
          playwright install chromium

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy autocomplete

      - name: Security audit
        run: pip-audit -r requirements.lock

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing -m "not e2e"

      - name: E2E smoke (Playwright)
        run: python -m pytest -m e2e
